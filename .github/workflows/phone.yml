# Eclipse on your phone (Phase 45): builds the phone page and publishes it to GitHub Pages at
# https://looby758.github.io/Eclipse/. Runs whenever main changes the page (or the shared core),
# and from the Actions tab ("Run workflow"). Only the page goes online, never your library.
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Phone page

on:
  push:
    branches: [main]
    paths: ['phone/**', 'src/core/**', 'package.json', 'package-lock.json', '.github/workflows/phone.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check and test
        run: npm run typecheck && npm test
      - name: Build the phone page
        run: npm run build:phone
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
